server:
  port: 8000
# Redis Configuration
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    openai:
      base-url: https://api.groq.com
      api-key: ${GROQ_API_KEY}
      chat:
        base-url: https://api.groq.com/openai/v1
        model: openai/gpt-oss-20b
        replay-reasoning-content: false
  data:
    redis:
      host: localhost
      port: 6379

    cache:
      type: redis
      cache-names:
        - productDetails
        - categories
        - attributes
      redis:
        time-to-live: 10m
        cache-null-values: false # Cache expiration time in milliseconds (10 minutes)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8000/login/oauth2/code/google
            scope: openid,profile,email
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/e-commerce  #Db url
    username: postgres #Db username
    password: user   #Db password
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 #Jwt expiration
logging:
  level:
    org.springframework.security: DEBUG

