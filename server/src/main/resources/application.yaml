server:
  port: 8000
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  #  sql:
  #    init:
  #      mode: always
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce  #Db url
    username: postgres #Db username
    password: user   #Db password
jwt:
  secret: ${JWT_SECRET} #Jwt secret
  expiration: 86400000 #Jwt expiration
logging:
  level:
    org.springframework.security: DEBUG

